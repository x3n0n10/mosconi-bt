name: Release

# Manual-only: this project has no public store/release distribution (see README's
# "Building a release APK" section), so builds here are opt-in - triggered by hand from
# the Actions tab whenever a signed APK is actually wanted, never on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: versionCode is derived from
          # `git rev-list --count HEAD` (see app/build.gradle.kts).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 repo secret isn't set - see README's" \
                 "'Building a signed release APK via GitHub Actions' section." >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Write release signing config
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # app/build.gradle.kts reads these four keys straight out of local.properties
          # (the same file Android Studio uses for sdk.dir locally) - appended, not
          # written fresh, so it coexists with anything else that lands in this file.
          cat >>local.properties <<EOF
          release.storeFile=$RUNNER_TEMP/release.keystore
          release.storePassword=$RELEASE_KEYSTORE_PASSWORD
          release.keyAlias=$RELEASE_KEY_ALIAS
          release.keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: mosconi-bt-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-build-reports
          path: app/build/reports
          retention-days: 7
          if-no-files-found: ignore
